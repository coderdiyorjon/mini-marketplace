version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: coder
      POSTGRES_PASSWORD: coder
      POSTGRES_DB: coder
    ports:
      - "5432:5432"
    volumes:
     - postgres_data:/var/lib/postgres/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marketplace_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  
  api:
  build:
  ports:
    - "8000:8000"
  depends_on:
    db:
      condition: service_started
    environment:
      - DATABASE_URL=postgresql://postgres:coder@db:5432/marketplace_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=supersecretkey

volumes:
  postgres_data: